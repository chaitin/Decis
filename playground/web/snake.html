<!DOCTYPE html>
<!--
  Decis playground. Adapted from https://github.com/taeold/djev-run (see NOTICE).
  Changed for Decis: the endpoint is the playground's own origin (it proxies
  /v1/systemone and attaches the API key server-side), and the page now wears the
  shared /theme.css, /i18n.js and /game.js -- the game bar, the manual/AI switch, the
  inference panel and the I/O console are the shell's, not this page's. The board and the
  move probabilities are side by side; the two panels about the call (inference, console)
  sit under both of them. The `state`, the `instructions` and the `criteria` stay English
  on purpose -- they are the API's language, not the reader's.

  Two ways to play: `manual` steers with the arrow keys and sends nothing, `ai` posts the
  state and plays the model's move. The planner (`planMoves`) runs either way and paints
  the tags next to every direction; in AI mode it is also the safety net, and that is
  deliberate for this game rather than the other two: a snake has no clock, so a move that
  is merely *legal* is a move it can repeat forever.

  This page used to hang, and the two halves of the cause were the two halves of the
  request. The criteria named only a compass direction ("Move north (y - 1)"), so the
  model had nothing to score: over 160 real boards its argmax was a legal move 71% of the
  time and a distance-reducing one 47% of the time. The shield then accepted every legal
  move, so those picks were played, and the snake settled into an exact 26-step loop with
  the score frozen at 5. Both halves are fixed here: the criteria are the planner's notes
  ("Blocked. The wall is there." / "Safe. Eats the food now. Best move."), and `allowed` --
  what the shield will execute -- is the set of moves that reduce the true distance to the
  food. Over the same 160 boards with these strings: 99% legal, 89% distance-reducing.
  (The wordings were measured, not guessed; see `describeMove` and `planMoves`.)

  A third part is what keeps that set from ever being empty: `spawnFood` places food only
  where the head can still walk. In the four 12x12 games measured (different food
  patterns), the snake plays 255-453 steps to 33-54 apples and ends when it fills a pocket
  of its own body (`Trapped`); it never revisits a board state, and the score never
  freezes. A reference implementation that walks a Hamiltonian cycle does not have this
  ending at all, because it can always reach any free cell; making this greedy planner do
  that would replace this page's decision with a cycle order.
-->

<script>

// The playground serves this page and proxies /v1/systemone to the running engine, so
// the endpoint is always same-origin and the page never holds an API key. The proxy
// rewrites `model` to whichever engine is up (playground/server.py).
const GRID = 12;
// The board's bitmap is drawn at this size and the stylesheet shows it at up to the same
// size, so the grid is never scaled up (a scaled-up canvas blurs the lines).
const CSS_SIZE = 480;
const DIRS = ["up", "down", "left", "right"];
const ARROWS = { up: "\u2191", down: "\u2193", left: "\u2190", right: "\u2192" };
const VEC = {
  up: [0, -1],
  down: [0, 1],
  left: [-1, 0],
  right: [1, 0]
};

//: Manual play is a tick, not a round trip: the snake moves at a fixed pace instead of as
//: fast as the engine answers, which is what makes steering possible.
const MANUAL_TICK_MS = 110;

//: Why a direction cannot be played at all. The criterion text is what the model scores,
//: which is why it says *why*: this page used to send "Move north (y - 1)" here, a string
//: that names the direction and says nothing about the board.
const BLOCKED = {
  neck: "Blocked. A 180-degree turn into its own neck.",
  wall: "Blocked. The wall is there.",
  body: "Blocked. Its own body is there."
};

const $ = id => document.getElementById(id);

function resolveEndpointUrl() {
  return "/v1/systemone";
}

let snake = [];
let direction = "right";
let manualDir = "right";
let food = [9, 3];
let score = 0;
let steps = 0;
let alive = true;
let won = false;
let running = false;
let inflight = false;
let sandboxFallback = false;
let loopToken = 0;
// The last thing the page wrote into the live readout, kept so a language switch can
// repaint it: `data-i18n` only covers the markup.
let lastDecision = null;
// How often the planner's invariant replaced the model's pick -- the one number on this
// page that is about the decision rather than the snake.
let shield = { calls: 0, vetoes: 0 };

const cellKey = (x, y) => x + "," + y;

function spawnFood(body) {
  const occupied = new Set(body.map(([x, y]) => cellKey(x, y)));
  // Only cells the head can still walk to. A food behind a wall of the snake's own body
  // is a game the planner cannot play: no move gets closer to it, so `allowed` collapses
  // to "anything legal", and the snake wanders until it hits something -- the same
  // aimless forever-motion this page is being fixed for. With the spawn restricted to the
  // head's own region, `planMoves` always has a move that reduces the distance, and the
  // snake cannot reach a step where it has nothing to do. (A cycle-following snake like
  // laya-mlx's gets this for free: it can walk its Hamiltonian cycle to any free cell, so
  // unreachable food never arises there.)
  const reachable = explore(body[0][0], body[0][1], new Set(body.slice(1, -1).map(([x, y]) => cellKey(x, y))));
  const free = [];
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const k = cellKey(x, y);
      if (!occupied.has(k) && reachable.has(k)) free.push([x, y]);
    }
  }
  if (!free.length) return null;
  const idx = (steps * 17 + score * 31 + 7) % free.length;
  return free[idx];
}

/* One breadth-first walk, two answers: how far the food is, and how much room the head
   has left. `blocked` is the caller's, because the game lets the tail go on a step that
   does not eat -- a cell the tail is about to leave is not an obstacle (`applyMove`). */
function explore(startX, startY, blocked) {
  const distances = new Map([[cellKey(startX, startY), 0]]);
  const queue = [[startX, startY]];
  for (let i = 0; i < queue.length; i++) {
    const [cx, cy] = queue[i];
    const next = distances.get(cellKey(cx, cy)) + 1;
    for (const d of DIRS) {
      const [vx, vy] = VEC[d];
      const nx = cx + vx, ny = cy + vy;
      const k = cellKey(nx, ny);
      if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID || blocked.has(k) || distances.has(k)) continue;
      distances.set(k, next);
      queue.push([nx, ny]);
    }
  }
  return distances;
}

/* The page's model of the board. The criteria the model scores, the tags the panel paints
   and the set the shield executes from are all this one object, so they cannot disagree. */
function planMoves() {
  const [hx, hy] = snake[0];
  const neck = snake[1] || null;
  const foodKey = food ? cellKey(food[0], food[1]) : null;
  const nowBlocked = new Set(snake.slice(1, -1).map(([x, y]) => cellKey(x, y)));
  const reachNow = explore(hx, hy, nowBlocked);
  const distanceNow = foodKey && reachNow.has(foodKey) ? reachNow.get(foodKey) : null;
  const collision = new Set(snake.slice(0, -1).map(([x, y]) => cellKey(x, y)));

  const moves = {};
  for (const d of DIRS) {
    const [vx, vy] = VEC[d];
    const tx = hx + vx, ty = hy + vy;
    let reason = "safe";
    if (neck && tx === neck[0] && ty === neck[1]) reason = "neck";
    else if (tx < 0 || tx >= GRID || ty < 0 || ty >= GRID) reason = "wall";
    else if (collision.has(cellKey(tx, ty))) reason = "body";

    if (reason !== "safe") {
      moves[d] = {
        legal: false, reason: reason, eats: false, distance: null, space: 0,
        progress: false, traps: false, note: BLOCKED[reason]
      };
      continue;
    }

    // The board as the next step finds it: the tail vacates, the head's old cell does
    // not.
    const eats = cellKey(tx, ty) === foodKey;
    const nextBody = eats ? [[tx, ty], ...snake] : [[tx, ty], ...snake.slice(0, -1)];
    const reach = explore(tx, ty, new Set(nextBody.slice(1, -1).map(([x, y]) => cellKey(x, y))));
    const distance = foodKey && reach.has(foodKey) ? reach.get(foodKey) : null;
    const progress = distance !== null && distanceNow !== null && distance < distanceNow;
    moves[d] = {
      legal: true, reason: "safe", eats: eats, distance: distance, space: reach.size,
      progress: progress,
      // Losing the food, or stepping into a pocket the snake cannot turn around in, is
      // safe this instant and hopeless a few steps later. Worth showing only when the move
      // makes no progress anyway: a tight move that reaches the food is still the way to
      // the food, and refusing it would be refusing to eat.
      traps: !progress && (distance === null || reach.size < snake.length)
    };
  }

  const legal = DIRS.filter(d => moves[d].legal);
  const closer = legal.filter(d => moves[d].progress);
  const untrapped = legal.filter(d => !moves[d].traps);
  // The invariant the shield executes from, and the whole anti-hang argument. A legal move
  // that does not reduce the true distance to the food is a move the snake can repeat
  // forever, so `closer` comes first. While the food is reachable there is always a
  // distance-reducing move, and taking one leaves the food reachable on the next step, so a
  // snake driven by this set cannot circle: it eats, or it has nowhere to go. The other two
  // branches are what keeps the shield correct without that argument -- a board with no
  // route to the food (which the spawn rule makes unreachable in AI mode, and which is what
  // a relaxed spawn rule or a hand-built board would hit) and a snake with no legal move at
  // all, which is how the game ends.
  const allowed = closer.length ? closer : (untrapped.length ? untrapped : legal);
  const best = plannerPick(allowed, moves, direction);

  const plan = {
    moves: moves,
    allowed: allowed,
    best: best,
    distanceNow: distanceNow,
    closer: closer.length,
    legal: legal.length
  };
  // The state is short on purpose. It is the one string that is *not* an option, and the
  // measurements say what an encoder does with a longer one: adding the head and food
  // coordinates dropped the model's distance-reducing picks from 81% to 31% on 80 real
  // boards (same criteria), while "Snake length" cost nothing. The coordinates are in the
  // criteria when they mean something ("The wall is there"), and the console still shows
  // the whole request.
  plan.state =
    `Safe route: ${closer.length ? "yes" : "no"}. ` +
    `Food reachable through empty cells: ${distanceNow === null ? "no" : "yes"}. ` +
    `Snake length ${snake.length}.`;
  for (const d of DIRS) moves[d].note = describeMove(d, moves[d], best, closer.length > 0);
  return plan;
}

/* The planner's own pick: the food first, then the shortest route, then the most room.
   Used when the model's ranking is unavailable and as the fallback inside the shield. */
function plannerPick(allowed, moves, fallback) {
  let best = fallback;
  let rank = null;
  for (const d of allowed) {
    const m = moves[d];
    const candidate = [m.eats ? 1 : 0, -(m.distance === null ? 1e9 : m.distance), m.space];
    if (rank === null
      || candidate[0] > rank[0]
      || (candidate[0] === rank[0] && candidate[1] > rank[1])
      || (candidate[0] === rank[0] && candidate[1] === rank[1] && candidate[2] > rank[2])) {
      best = d;
      rank = candidate;
    }
  }
  return best;
}

/* One line per direction, in the words the model scores. Half of the bug this page had was
   here: with criteria that named a compass direction, the model's argmax was a legal move
   71% of the time and a distance-reducing one 47%; with these lines it is 99% and 89% (160
   real boards, engine `laya-multilingual`, same boards for both prompts). The wording was
   measured, not guessed -- "A longer route to the food" held up, "Reaches the food in N
   steps" did not. */
function describeMove(d, move, best, routeExists) {
  if (!move.legal) return move.note;
  if (move.eats) return d === best ? "Safe. Eats the food now. Best move." : "Safe. Eats the food now.";
  if (move.progress) return d === best ? "Safe. Best route to the food." : "Safe. A longer route to the food.";
  if (move.traps) return "Unsafe. Traps the snake.";
  // The planner found no route at all: nothing gets closer, so "wastes the step" would be
  // a lie about a choice that has no better option.
  if (!routeExists) return "Safe. Nothing reaches the food from here.";
  return "Safe but it does not get closer to the food.";
}

// The one question this page asks. The criteria keys are the wire's move names, so the
// answer's `choice` and its `probabilities` keys are directions already.
function buildQuestions(plan) {
  const criteria = {};
  for (const d of DIRS) criteria[d] = plan.moves[d].note;
  return {
    move: {
      type: "choice",
      instructions: "Choose the best safe move for the snake. Prefer eating the food, then the shortest route to it. Never choose a move that collides or traps the snake.",
      criteria: criteria
    }
  };
}

/* The model's ranking, restricted to what the planner proved worth playing. Falls back to
   the planner's own pick when the response carried no usable probabilities. */
function shieldPick(plan, probs) {
  let best = plan.best;
  let bestProb = probs ? (probs[best] || 0) : 0;
  for (const d of plan.allowed) {
    const p = probs ? (probs[d] || 0) : 0;
    if (p > bestProb) {
      best = d;
      bestProb = p;
    }
  }
  return best;
}

/* The local stand-in for the engine: used when the call itself fails (a 422 while the
   model reloads, a dead network). It scores the planner's own analysis, so the fallback
   plays the game the criteria describe rather than a different one. */
function simulateSystemOne(plan) {
  const logits = {};
  for (const d of DIRS) {
    const m = plan.moves[d];
    if (!m.legal) {
      logits[d] = -4.5;
    } else if (plan.allowed.includes(d)) {
      const distance = m.distance === null ? 0 : Math.min(m.distance, 40);
      logits[d] = 2.6 - distance * 0.06 + Math.min(m.space, 80) * 0.02 + (d === plan.best ? 0.9 : 0);
    } else {
      logits[d] = m.traps ? -2.0 : 0.3;
    }
  }
  const mx = Math.max(...Object.values(logits));
  const exps = {};
  let sum = 0;
  for (const d of DIRS) {
    exps[d] = Math.exp(logits[d] - mx);
    sum += exps[d];
  }
  const probs = {};
  let bestDir = plan.best, bestP = -1;
  for (const d of DIRS) {
    probs[d] = exps[d] / sum;
    if (probs[d] > bestP) {
      bestP = probs[d];
      bestDir = d;
    }
  }
  return {
    model: "simulated",
    answers: {
      move: {
        type: "choice",
        choice: bestDir,
        probabilities: probs,
        confidence: bestP
      }
    }
  };
}

// One POST, and the one call `GameShell.observe` hears about. The body it reports is the
// body it sent, so the I/O console shows the request and not the page's bookkeeping.
async function requestDecision(plan) {
  const reqBody = {
    model: "jev-latest",
    state: plan.state,
    questions: buildQuestions(plan)
  };
  const t0 = performance.now();
  let reported = false;
  try {
    const resp = await fetch(resolveEndpointUrl(), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(reqBody)
    });
    const ms = Math.round(performance.now() - t0);
    let data = null;
    try {
      data = await resp.json();
    } catch (ignored) {
      data = null;
    }
    GameShell.observe({ request: reqBody, response: data, status: resp.status, latencyMs: ms });
    reported = true;
    if (!resp.ok) {
      // A 422 (over budget) or a 503 (engine still loading) is not a crash: the game falls
      // back to the local simulation and says `sim` in the status.
      sandboxFallback = true;
      return { data: simulateSystemOne(plan), ms };
    }
    sandboxFallback = false;
    return { data, ms };
  } catch (err) {
    const ms = Math.max(11, Math.round(performance.now() - t0));
    if (!reported) GameShell.observe({ request: reqBody, error: err, latencyMs: ms });
    sandboxFallback = true;
    return { data: simulateSystemOne(plan), ms };
  }
}

/* The move names, the planner's verdicts and the chosen move are wire values. They are
   shown as the API spelled them; only the label around them is translated.

   `source` says where the number came from: `ai` is the model's probability, `manual` is a
   human's key press, `none` is "no call has happened yet". Only `ai` gets bars -- a
   probability of 0.0% would be a measurement nobody made. */
function paintDecision() {
  if (!lastDecision) return;
  const { plan, probs, finalChoice, rawChoice, source } = lastDecision;
  let badge = "\u2014";
  if (source === "ai") {
    badge = I18N.t("badge.ai", {
      move: finalChoice,
      pct: (((probs && probs[finalChoice]) || 0) * 100).toFixed(1) + "%"
    });
    // Saying what was replaced is the honest version of the bar chart: the bars are the
    // model's opinion, the move on the board is the shield's.
    if (rawChoice && rawChoice !== finalChoice) {
      badge += " " + I18N.t("badge.shield", { from: rawChoice });
    }
  } else if (source === "manual") {
    badge = I18N.t("badge.manual", { move: ARROWS[finalChoice] + " " + I18N.t("dir." + finalChoice) });
  }
  $("choice-badge").textContent = badge;

  for (const d of DIRS) {
    const move = plan.moves[d];
    const isSelected = d === finalChoice;
    const measured = source === "ai" && !!probs;
    const p = measured ? Math.max(0, Math.min(1, Number(probs[d] || 0))) : 0;
    const verdict = !move.legal ? move.reason
      : move.eats ? "eat"
        : move.progress ? "safe"
          : move.traps ? "trap" : "away";
    const kind = move.eats || move.progress ? "ok" : (move.legal && !move.traps ? "warn" : "blocked");

    $("name-" + d).className = "dir-name" + (isSelected && source !== "none" ? " chosen" : "");
    $("name-" + d).textContent = `${ARROWS[d]} ${I18N.t("dir." + d)}`;

    const safeEl = $("safe-" + d);
    safeEl.textContent = I18N.t("reason." + verdict);
    safeEl.className = "tag " + kind;

    const barEl = $("bar-" + d);
    barEl.style.width = measured ? (p * 100).toFixed(1) + "%" : "0%";
    barEl.className = "bar-fill" + (measured && isSelected ? " chosen" : "");

    $("val-" + d).className = "prob-pct" + (measured && isSelected ? "" : " dim");
    $("val-" + d).textContent = measured ? (p * 100).toFixed(1) + "%" : "\u2014";
  }
}

// How often the planner had to overrule the model. It is the readout that says whether
// the criteria are doing their job: a shield that fires on most steps is a prompt that is
// not carrying the decision.
function paintShield() {
  GameShell.setNote("note.shield", {
    allowed: lastDecision && lastDecision.plan.allowed.length
      ? lastDecision.plan.allowed.join("/")
      : "\u2014",
    vetoes: shield.vetoes,
    calls: shield.calls
  });
}

/* Everything the script writes as text is repainted from here, so switching language
   mid-game updates the live readout too -- `data-i18n` only covers the markup. */
function renderTexts() {
  document.title = I18N.t("page.docTitle");
  paintDecision();
  paintShield();
}

function updateUI(plan, probs, finalChoice, rawChoice, source) {
  lastDecision = { plan, probs, finalChoice, rawChoice, source };
  $("m-score").textContent = String(score);
  $("m-steps").textContent = String(steps);
  paintDecision();
  paintShield();
}

function drawBoard() {
  const canvas = $("board");
  const dpr = window.devicePixelRatio || 1;
  const targetW = Math.round(CSS_SIZE * dpr);
  if (canvas.width !== targetW || canvas.height !== targetW) {
    canvas.width = targetW;
    canvas.height = targetW;
  }
  const ctx = canvas.getContext("2d");
  ctx.save();
  ctx.scale(dpr, dpr);

  const W = CSS_SIZE;
  const H = CSS_SIZE;
  const cell = W / GRID;

  ctx.fillStyle = "#f8fafc";
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "#e2e8f0";
  ctx.lineWidth = 1;
  for (let i = 1; i < GRID; i++) {
    const p = Math.floor(i * cell) + 0.5;
    ctx.beginPath();
    ctx.moveTo(p, 0);
    ctx.lineTo(p, H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, p);
    ctx.lineTo(W, p);
    ctx.stroke();
  }

  // Target food. There is none once the board is full, which is the win.
  if (food) {
    const [fx, fy] = food;
    const fcx = (fx + 0.5) * cell;
    const fcy = (fy + 0.5) * cell;
    ctx.fillStyle = "#16a34a";
    ctx.beginPath();
    ctx.arc(fcx, fcy, cell * 0.28, 0, Math.PI * 2);
    ctx.fill();
  }

  // Snake segments
  for (let i = snake.length - 1; i >= 0; i--) {
    const [sx, sy] = snake[i];
    const isHead = i === 0;
    ctx.fillStyle = isHead ? "#0969da" : "#3b82f6";
    ctx.globalAlpha = isHead ? 1.0 : Math.max(0.45, 0.9 - (i / (snake.length + 5)) * 0.45);
    const pad = isHead ? cell * 0.09 : cell * 0.14;
    ctx.beginPath();
    ctx.roundRect(sx * cell + pad, sy * cell + pad, cell - pad * 2, cell - pad * 2, isHead ? 5 : 4);
    ctx.fill();

    if (isHead) {
      ctx.globalAlpha = 1.0;
      ctx.fillStyle = "#ffffff";
      const [vx, vy] = VEC[direction] || [1, 0];
      const hcx = (sx + 0.5) * cell;
      const hcy = (sy + 0.5) * cell;
      const fwd = cell * 0.16;
      const side = cell * 0.13;
      const px = -vy, py = vx;
      ctx.beginPath();
      ctx.arc(hcx + vx * fwd + px * side, hcy + vy * fwd + py * side, 1.8, 0, Math.PI * 2);
      ctx.arc(hcx + vx * fwd - px * side, hcy + vy * fwd - py * side, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

function applyMove(chosenDir) {
  const [hx, hy] = snake[0];
  const [vx, vy] = VEC[chosenDir];
  const nx = hx + vx;
  const ny = hy + vy;
  const bodyObstacles = new Set(snake.slice(0, -1).map(([x, y]) => cellKey(x, y)));

  if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID || bodyObstacles.has(cellKey(nx, ny))) {
    alive = false;
    running = false;
    loopToken += 1;
    GameShell.setRunning(false);
    GameShell.setStatus("status.collision", null, "err");
    drawBoard();
    return;
  }

  snake.unshift([nx, ny]);
  direction = chosenDir;
  if (food && nx === food[0] && ny === food[1]) {
    score += 1;
    const next = spawnFood(snake);
    if (next) {
      food = next;
    } else if (snake.length === GRID * GRID) {
      // Every cell is the snake: there is nothing left to ask the model about, and no food
      // to walk to.
      won = true;
      food = null;
      running = false;
      loopToken += 1;
      GameShell.setRunning(false);
      GameShell.setStatus("status.won", null, "live");
    } else {
      // The head is sealed inside a region the snake itself fills, so no reachable cell is
      // left to put food in -- a dead end, not a victory. It is what the spawn rule in
      // `spawnFood` makes rare; saying it out loud beats reporting a win.
      alive = false;
      food = null;
      running = false;
      loopToken += 1;
      GameShell.setRunning(false);
      GameShell.setStatus("status.trapped", null, "err");
    }
  } else {
    snake.pop();
  }
  steps += 1;
}

function resetGame() {
  running = false;
  loopToken += 1;
  GameShell.setRunning(false);
  snake = [[5, 6], [4, 6], [3, 6], [2, 6]];
  direction = "right";
  manualDir = "right";
  score = 0;
  steps = 0;
  alive = true;
  won = false;
  lastDecision = null;
  shield = { calls: 0, vetoes: 0 };
  food = spawnFood(snake);
  GameShell.resetTelemetry();
  GameShell.setStatus("status.idle", null, "");
  updateUI(planMoves(), null, "right", null, "none");
  drawBoard();
}

async function stepOnce() {
  if (inflight || !alive || won) return;
  inflight = true;
  const plan = planMoves();
  const { data, ms } = await requestDecision(plan);
  const moveAns = (data.answers && data.answers.move) || {};
  const probs = moveAns.probabilities || null;
  const rawChoice = moveAns.choice || (probs && DIRS.reduce((a, b) => (probs[a] >= probs[b] ? a : b))) || plan.best;

  // The safety net. It is the planner's invariant, not a second model: `allowed` holds the
  // moves that keep the food reachable and get closer to it, and a pick from outside it is
  // replaced by the highest-probability allowed one (`shieldPick` falls back to the
  // planner's own pick when the engine answered without probabilities).
  shield.calls += 1;
  const finalChoice = plan.allowed.includes(rawChoice) ? rawChoice : shieldPick(plan, probs);
  if (finalChoice !== rawChoice) shield.vetoes += 1;

  applyMove(finalChoice);
  if (alive && !won) {
    GameShell.setStatus(sandboxFallback ? "status.running.sim" : "status.running.live", null, "live");
  }
  updateUI(plan, probs, finalChoice, rawChoice, "ai");
  drawBoard();
  inflight = false;
}

async function loop(token) {
  while (running && alive && !won && token === loopToken) {
    const tStart = performance.now();
    const manual = GameShell.mode() === "manual";
    if (manual) {
      // Manual play is the human's: the planner only paints the tags here, it does not
      // veto an arrow key.
      const plan = planMoves();
      applyMove(manualDir);
      if (alive && !won) GameShell.setStatus("status.running.manual", null, "live");
      updateUI(plan, null, manualDir, null, "manual");
      drawBoard();
    } else {
      await stepOnce();
    }
    if (!running || !alive || won || token !== loopToken) break;
    const elapsed = performance.now() - tStart;
    const wait = Math.max(0, (manual ? MANUAL_TICK_MS : 50) - elapsed);
    if (wait > 0) {
      await new Promise(r => setTimeout(r, wait));
    }
  }
}

function toggleStart() {
  if (!alive || won) resetGame();
  running = !running;
  GameShell.setRunning(running);
  if (running) {
    const token = ++loopToken;
    loop(token);
  } else {
    GameShell.setStatus("status.paused", null, "");
  }
}

window.addEventListener("keydown", e => {
  const dir = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
  if (!dir || GameShell.mode() !== "manual") return;
  e.preventDefault();
  // No 180-degree turn: the neck is where the head just was, so that move is death.
  const opposite = { up: "down", down: "up", left: "right", right: "left" }[direction];
  if (dir !== opposite) manualDir = dir;
});

GameShell.init({
  game: "snake",
  onStart: toggleStart,
  onReset: resetGame,
  onMode: mode => {
    // Entering manual mode starts from the current heading, so the first arrow press
    // cannot be a 180-degree turn into the snake's own neck.
    if (mode === "manual") manualDir = direction;
  }
});
I18N.onChange(renderTexts);

resetGame();
renderTexts();
</script>
</body>
</html>
