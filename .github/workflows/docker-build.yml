name: Docker images

# Builds one image per engine and publishes them to Docker Hub under a single
# repository: `chaitin/decis:<engine>`. One repository rather than one per engine
# because the engine is a flavour of the same server, not a different product, and
# because adding an engine should not mean creating and configuring a new Docker Hub
# repository. The consequence is that every tag carries its engine: `laya-multilingual-v1.2.0`,
# `laya-multilingual-runtime-v1.2.0`.
#
# The image that carries the engine's name carries its *weights*: `docker pull
# chaitin/decis:laya-multilingual && docker run` has to work with no network, no volume and
# no download step, or the tag is not doing the one thing a per-engine image is for. A
# release tag also publishes the weightless variant as `<engine>-runtime-<version>`, for
# deployments that keep one copy of the weights on a shared volume or that must keep every
# node's image small. There is no `-offline` suffix: with the weights baked into the
# default, `-offline` would be a second name for the same thing.
#
# Why one image per engine rather than one image with everything: the engine extras
# conflict and are large (`AGENTS.md §6`), and a `kev` image that also carried Laya's
# dependency tree would be gigabytes of code that can never run. `docs/design.md §7` is
# the packaging rationale.
#
# Why per-platform *native* runners instead of QEMU: the Dockerfile installs torch, and
# the `laya`/`kev` extras pull hundreds of megabytes of wheels. Emulating that under QEMU
# turns a five-minute build into a very long one. `ubuntu-24.04-arm` is a native arm64
# runner, so each platform builds on real hardware and the manifests are merged after.
#
# The playground image (`playground/Dockerfile`) is the one non-engine artifact: its tag
# is `playground` on the default branch and `playground-<version>` on a release, it is
# built for both architectures in a single job because that Dockerfile has no `RUN`, and
# it shares this repository because a second Docker Hub repository would be a manual step
# that nothing else needs.
#
# If your repository cannot use `ubuntu-24.04-arm` (it needs a public repository or a paid
# plan), delete the `linux/arm64 ubuntu-24.04-arm` entry from `platforms` in the plan job
# below. Everything else keeps working and the images become amd64-only.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      engines:
        description: Space-separated engine ids to build
        default: "laya-multilingual kev-0.8b"
      runtime_variants:
        description: Also build the weightless `-runtime` variants
        type: boolean
        default: false
      push:
        description: Push to Docker Hub (off by default so a dry run cannot publish)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  # Docker Hub, not GHCR: it is where a user looking for an image goes first, and the
  # project only needs one public registry. `docker.io` is explicit even though it is the
  # default, so the login and the image refs cannot drift apart.
  REGISTRY: docker.io
  # The namespace the images are published under. Kept separate from
  # `DOCKERHUB_USERNAME`, which is a *login* identity: an organization is not a user
  # account (an organization access token is used with the organization name as the
  # username), so deriving the namespace from the credential publishes to whichever
  # account holds the token -- which is how images end up somewhere no document names.
  # Set the `DOCKERHUB_NAMESPACE` repository variable to publish elsewhere (a fork);
  # `chaitin` is this repository's namespace. The repository has to *exist* on Docker Hub and
  # the credential has to have push access to it, or every leg fails at the push step with
  # `insufficient_scope` after the image is already built. An organization access token is
  # the sharper edge: it is scoped to the repositories that existed when it was created, so
  # one issued before the repository did cannot publish to it. `||` is a default, not a
  # ternary: an empty variable is falsy, which is exactly when the default should win.
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'chaitin' }}
  # Every image lands in this one repository, with the engine in the tag.
  IMAGE_REPO: decis

jobs:
  # The images are gated on the tests: publishing a broken image under a version tag is
  # harder to undo than not publishing it.
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: The docs' performance tables match the raw benchmark JSON
        run: uv run python benchmarks/report.py --check

  # What to build, and where, decided in one job so the matrix has a single definition.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      merges: ${{ steps.plan.outputs.merges }}
      push: ${{ steps.plan.outputs.push }}
      tag: ${{ steps.plan.outputs.tag }}
      # The playground is not an engine, so it is not in the engine matrix above: it is one
      # build of `playground/Dockerfile` under its own tag. Its values are decided here for
      # the same reason the engines' are -- one place computes a published name.
      playground_tag: ${{ steps.plan.outputs.playground_tag }}
      playground_platforms: ${{ steps.plan.outputs.playground_platforms }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_ENGINES: ${{ inputs.engines }}
          INPUT_RUNTIME: ${{ inputs.runtime_variants }}
          INPUT_PUSH: ${{ inputs.push }}
          # Present so the guard below can fail fast. Configuration, not a secret used
          # here: the value only has to be *non-empty* for the publish to be possible.
          HAVE_CREDENTIALS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail

          # Every engine with an image. Both are real checkpoints; there is no
          # weight-free image any more (the test double lives in `tests/`, not in the
          # registry), so a base image with no extras is a build-time check, not a
          # thing to publish.
          all_engines=(laya-multilingual kev-0.8b)
          # Engines whose weights can be baked in.
          bakeable=(laya-multilingual kev-0.8b)

          # Set by the PR branch below: build the Dockerfile with no engine extra at all.
          # An engine-free image is the cheapest way to prove the install path still
          # works, and it is why a PR does not have to pull torch.
          base_only=false

          case "$EVENT" in
            pull_request)
              # A PR validates that the Dockerfile still builds. One engine, one
              # platform, and no engine extra: the point is the Dockerfile, not the
              # artifact. `DECIS_ENGINE` stays a real id so `/v1/models` still answers.
              engines=(laya-multilingual)
              platforms=("linux/amd64 ubuntu-latest")
              push=false
              base_only=true
              ;;
            workflow_dispatch)
              # shellcheck disable=SC2206
              engines=($INPUT_ENGINES)
              platforms=("linux/amd64 ubuntu-latest" "linux/arm64 ubuntu-24.04-arm")
              push=$INPUT_PUSH
              ;;
            *)
              engines=("${all_engines[@]}")
              platforms=("linux/amd64 ubuntu-latest" "linux/arm64 ubuntu-24.04-arm")
              push=true
              ;;
          esac

          # A publish that cannot authenticate must stop the run here, before six builds
          # have been paid for. Failing loudly beats silently skipping the publish: a
          # green run that pushed nothing is the failure mode nobody notices.
          if [ "$push" = "true" ] && [ "${HAVE_CREDENTIALS:-false}" != "true" ]; then
            echo "error: this run would publish, but DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set." >&2
            echo "       Add both as repository secrets, or run this workflow with push=false." >&2
            exit 1
          fi

          # The default image for an engine bakes that engine's weights in, so
          # `docker run` needs no network and no volume. The weightless variant is the
          # exception and carries a suffix: `-runtime`.
          runtime_variants=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_RUNTIME" = "true" ]; then
            runtime_variants=true
          elif [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            runtime_variants=true
          fi

          # Which pip extra provides an engine's dependencies. The matrix carries this
          # rather than the build step computing it from the engine name, because the
          # obvious spelling -- `engine == 'x' && '' || 'laya'` -- is wrong: an empty
          # string is falsy in a GitHub expression, so the `||` branch wins and an
          # engine-free image installs Laya and torch. It did, and shipped 3.1 GB of it
          # (docs/design-review.md §2-D14). Deciding here also gives the mapping one
          # home, and this script is executed by the tests, so an engine with no extra
          # is a loud failure instead of a silent default.
          extra_for() {
            case "$1" in
              laya-multilingual) echo "laya" ;;
              kev-0.8b) echo "kev" ;;
              *)
                echo "error: no pip extra is mapped for engine '$1'." >&2
                echo "       Add it here and to the build-args test's expectations." >&2
                return 1
                ;;
            esac
          }

          # The moving tag. A branch push must not move `latest`, and `latest` is not part
          # of an image's name: `chaitin/decis:laya-multilingual` IS the current Laya image,
          # the way `:latest` is the current image of a single-purpose repository. Only a
          # release tag appends something, and then it pins: `laya-multilingual-v1.2.0`.
          if [[ "$REF" == refs/tags/v* ]]; then
            moving="$REF_NAME"
          elif [ "$REF_NAME" = "master" ] || [ "$REF_NAME" = "main" ]; then
            moving=latest
          else
            # Prefer the SHA the runner was given: `git rev-parse` needs a commit to
            # exist, and a shallow checkout or a detached HEAD can leave it unable to
            # answer, which would fail the run before it built anything.
            moving="sha-${GITHUB_SHA:0:7}"
          fi

          # The playground's tag. It shares the repository with the engines (there is no
          # second Docker Hub repository to create), and it follows the same shape -- the
          # name alone on the default branch, `-<version>` on a release, `-sha-<commit>`
          # on anything else -- but it is a different artifact, so it never wears an
          # engine's tag. `test_compose.py` reads this value rather than writing
          # `playground` again.
          playground_tag="playground"
          [ "$moving" = "latest" ] || playground_tag="playground-$moving"

          # A PR builds the playground too -- it is the cheapest Dockerfile in the
          # repository, and the check is the point -- but only for one platform: a
          # multi-platform build with `push: false` cannot export a manifest list, so
          # asking for both would fail the PR for a reason that has nothing to do with
          # the change. A publish builds both, and the Dockerfile has no `RUN`, so the
          # arm64 half needs no emulation.
          playground_platforms="linux/amd64,linux/arm64"
          [ "$base_only" = "true" ] && playground_platforms="linux/amd64"

          # One build per engine x variant x platform, and one merge per engine x variant
          # (the merge is what turns two platform images into one multi-arch manifest).
          #
          # `image_tag` is computed here, not in the build and merge steps, because both of
          # them need it and two copies of a tag scheme is how a manifest ends up named
          # differently from the images it points at. This script is executed by the tests.
          builds="["
          merges="["
          first_build=1
          first_merge=1
          for engine in "${engines[@]}"; do
            extra="$(extra_for "$engine")" || exit 1
            # On a PR the image is deliberately engine-free: no extra is installed, so
            # the build validates the Dockerfile without pulling torch.
            [ "$base_only" = "true" ] && extra=""
            # `baked` is the default: the weights go into the image whose tag is the engine
            # name. `-runtime` is the weightless variant, and it is only worth a second
            # build when something consumes it (a release, or a dispatch that asks).
            variants=(baked)
            if [ "$base_only" = "true" ]; then
              # The PR build is engine-free -- no extra is installed, so there is nothing to
              # bake with. Naming it `runtime` (weightless) keeps the job name honest.
              variants=(runtime)
            elif [ "$runtime_variants" = "true" ] && [[ " ${bakeable[*]} " == *" $engine "* ]]; then
              variants=(baked runtime)
            fi
            for variant in "${variants[@]}"; do
              bake="$engine"
              [ "$variant" = "runtime" ] && bake=""
              image_tag="$engine"
              [ "$variant" = "runtime" ] && image_tag="${image_tag}-runtime"
              [ "$moving" = "latest" ] || image_tag="${image_tag}-${moving}"
              [ $first_merge -eq 1 ] || merges+=","
              first_merge=0
              merges+="{\"engine\":\"$engine\",\"variant\":\"$variant\",\"image_tag\":\"$image_tag\"}"
              for platform in "${platforms[@]}"; do
                # shellcheck disable=SC2086
                set -- $platform
                [ $first_build -eq 1 ] || builds+=","
                first_build=0
                builds+="{\"engine\":\"$engine\",\"variant\":\"$variant\",\"bake\":\"$bake\",\"extra\":\"$extra\",\"image_tag\":\"$image_tag\",\"platform\":\"$1\",\"runner\":\"$2\",\"arch\":\"${1#linux/}\"}"
              done
            done
          done
          builds+="]"
          merges+="]"

          echo "matrix={\"include\":$builds}" >> "$GITHUB_OUTPUT"
          echo "merges={\"include\":$merges}" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "tag=$moving" >> "$GITHUB_OUTPUT"
          echo "playground_tag=$playground_tag" >> "$GITHUB_OUTPUT"
          echo "playground_platforms=$playground_platforms" >> "$GITHUB_OUTPUT"
          echo "builds: $builds"
          echo "merges: $merges"
          echo "push=$push tag=$moving playground_tag=$playground_tag"

  build:
    name: ${{ matrix.engine }} ${{ matrix.variant }} (${{ matrix.arch }})
    needs: [test, plan]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Needed for provenance attestation: it is what lets a consumer check that an image
      # was built from this commit by this workflow. Registry-independent -- it is the
      # Sigstore OIDC flow, not a Docker Hub permission.
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        env:
          ENGINE: ${{ matrix.engine }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
          IMAGE_TAG: ${{ matrix.image_tag }}
        run: |
          set -euo pipefail
          # A published name, not a credential: `IMAGE_NAMESPACE` is fixed by the
          # workflow, so a token belonging to some other account cannot move the images
          # somewhere no document names. Lowercased because registries require it.
          namespace="$(echo "$IMAGE_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${namespace}/${IMAGE_REPO}"
          short="${GITHUB_SHA::12}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            # The human-readable tag, then the provenance tag. The merge job consumes the
            # latter, and it must name the artifact as well as the platform: all engines
            # share this repository, so a bare `sha-<commit>-<arch>` is written by every
            # engine's leg at once. They overwrite each other, and each merge then reads
            # whichever engine happened to finish last -- which is how three different
            # images all ended up published as the same manifest.
            echo "${image}:${IMAGE_TAG}-${ARCH}"
            echo "${image}:${IMAGE_TAG}-sha-${short}-${ARCH}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to attest
        id: attest
        env:
          PUSHING: ${{ needs.plan.outputs.push }}
        run: |
          # Attestation requires a push; requesting it on a build-only run fails.
          if [ "$PUSHING" = "true" ]; then
            echo "sbom=true" >> "$GITHUB_OUTPUT"
            echo "provenance=mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "sbom=false" >> "$GITHUB_OUTPUT"
            echo "provenance=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # On a PR nothing is pushed, but the build still has to happen: that is the
          # check. Nothing is loaded locally because a single-platform build of a matrix
          # leg has no consumer here.
          push: ${{ needs.plan.outputs.push == 'true' }}
          build-args: |
            DECIS_EXTRAS=${{ matrix.extra }}
            DECIS_ENGINE=${{ matrix.engine }}
            DECIS_PREDOWNLOAD=${{ matrix.bake }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          sbom: ${{ steps.attest.outputs.sbom }}
          provenance: ${{ steps.attest.outputs.provenance }}
          cache-from: type=gha,scope=${{ matrix.engine }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.engine }}-${{ matrix.variant }}-${{ matrix.arch }}

  # The playground: the three browser games and the proxy that feeds them. A separate
  # job rather than another matrix leg, because it is not an engine -- a different
  # Dockerfile, no engine extra, no weights, no per-architecture merge to do. Pushing a
  # multi-platform build in one step produces the manifest list directly, which is only
  # safe because `playground/Dockerfile` has no `RUN`: nothing has to execute under
  # emulation to produce the arm64 half.
  playground:
    name: playground image
    needs: [test, plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image name and tag
        id: meta
        env:
          # The name comes from the plan script, not from here: `latest` is not part of
          # the playground's name either, and a release appends its version.
          PLAYGROUND_TAG: ${{ needs.plan.outputs.playground_tag }}
        run: |
          set -euo pipefail
          namespace="$(echo "$IMAGE_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${namespace}/${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${PLAYGROUND_TAG}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to attest
        id: attest
        env:
          PUSHING: ${{ needs.plan.outputs.push }}
        run: |
          if [ "$PUSHING" = "true" ]; then
            echo "sbom=true" >> "$GITHUB_OUTPUT"
            echo "provenance=mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "sbom=false" >> "$GITHUB_OUTPUT"
            echo "provenance=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: playground/Dockerfile
          platforms: ${{ needs.plan.outputs.playground_platforms }}
          push: ${{ needs.plan.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          sbom: ${{ steps.attest.outputs.sbom }}
          provenance: ${{ steps.attest.outputs.provenance }}
          cache-from: type=gha,scope=playground
          cache-to: type=gha,mode=max,scope=playground

  # A multi-arch manifest is what makes one tag correct on a laptop and on an arm server.
  # The build legs push per-architecture images; this job stitches them into one manifest.
  merge:
    name: merge ${{ matrix.engine }} ${{ matrix.variant }}
    needs: [plan, build]
    if: needs.plan.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.merges) }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the multi-arch manifest
        env:
          ENGINE: ${{ matrix.engine }}
          VARIANT: ${{ matrix.variant }}
          IMAGE_TAG: ${{ matrix.image_tag }}
          MOVING_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          namespace="$(echo "$IMAGE_NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${namespace}/${IMAGE_REPO}"
          short="${GITHUB_SHA::12}"

          # The per-arch tags exist only if that platform's leg ran. Merging a digest that
          # is not there would fail the release over a platform that was intentionally
          # skipped, so only the tags that resolve are merged -- and what was merged is
          # printed, so an amd64-only release cannot look like a multi-arch one.
          sources=()
          for arch in amd64 arm64; do
            ref="${image}:${IMAGE_TAG}-sha-${short}-${arch}"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              sources+=("$ref")
            else
              echo "note: $ref was not built; leaving it out of the manifest" >&2
            fi
          done
          [ ${#sources[@]} -gt 0 ] || { echo "nothing to merge for ${image}:${IMAGE_TAG}" >&2; exit 1; }

          docker buildx imagetools create --tag "${image}:${IMAGE_TAG}" "${sources[@]}"
          docker buildx imagetools inspect "${image}:${IMAGE_TAG}"

          # `laya-multilingual` is the server's default engine and the one whose install
          # the README leads with, so it is the right answer to a bare
          # `docker pull chaitin/decis`. It is the *baked* variant, not `-runtime`: the bare
          # name has to be the one that works with no network. Nothing else gets a bare
          # `latest`, and only when this run actually moved `latest`.
          if [ "$ENGINE" = "laya-multilingual" ] && [ "$VARIANT" = "baked" ] && [ "$MOVING_TAG" = "latest" ]; then
            docker buildx imagetools create --tag "${image}:latest" "${sources[@]}"
            docker buildx imagetools inspect "${image}:latest"
          fi

  # Pushing a `v*` tag is the whole release procedure: the jobs above publish the images,
  # and this turns the same tag into a GitHub Release. Without it the Releases page is
  # whatever someone published by hand -- which is how `v0.1.0` stayed the "latest release"
  # while the tags moved on without one.
  release:
    name: github release
    needs: [plan, merge, playground]
    if: needs.plan.outputs.push == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release for this tag if it has none
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `--generate-notes` builds the changelog from the commits since the previous
          # tag, so the notes cannot drift from what shipped. A tag that already has a
          # release is left alone: this creates the missing ones, it does not edit
          # something that is already published.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already has a release"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
