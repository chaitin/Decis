name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv writes its cache here; the runner's default is not always writable.
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  test:
    name: lint + tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The engines themselves are platform-specific, but the API and the
        # contract are not: they must hold everywhere.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        # No weights are downloaded and no network is used: the weight-free test double
        # in `tests/` and the vendored OpenAPI snapshot are the whole fixture set.
        run: uv run pytest -q

      - name: The docs' performance tables match the raw benchmark JSON
        # AGENTS.md §8: a number in the docs that was not rendered from
        # benchmarks/results/ fails here. This is what makes the rule executable
        # rather than aspirational; `tests/test_benchmark_report.py` guards the
        # checker itself, including that a hand-edited digit is detected.
        run: uv run python benchmarks/report.py --check

      - name: The server starts with a real HTTP client
        # No engine extra is installed here, so no decision request can be answered --
        # `tests/test_examples.py` covers that over a real socket, on the weight-free
        # test double. What this step adds is that the *process* starts outside pytest
        # and that the lazy registry answers `/v1/models` with no engine framework
        # installed (AGENTS.md §6).
        run: |
          uv run python - <<'PY'
          import json, threading, time, urllib.request
          from decis.app import create_app
          from decis.config import Settings

          settings = Settings(api_keys=("ci",), host="127.0.0.1", default_engine="laya-multilingual", env_file="")
          app = create_app(settings)

          import uvicorn
          server = uvicorn.Server(uvicorn.Config(app, host="127.0.0.1", port=8123, log_level="warning"))
          threading.Thread(target=server.run, daemon=True).start()
          for _ in range(200):
              if server.started:
                  break
              time.sleep(0.05)

          def call(path):
              request = urllib.request.Request(
                  f"http://127.0.0.1:8123{path}",
                  headers={"Authorization": "Bearer ci", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request) as response:
                  return response.status, dict(response.headers), json.loads(response.read())

          status, _, _ = call("/healthz")
          assert status == 200, status
          status, headers, body = call("/v1/models")
          assert status == 200, status
          assert headers["x-typesafe-request-id"].startswith("req_"), headers
          names = [model["name"] for model in body["models"]]
          assert any(name.startswith("decis/laya-multilingual@") for name in names), names
          print("smoke test ok:", names)
          PY

  upstream:
    name: upstream contract (with the laya extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `tests/test_upstream_contract.py` asserts that the Laya functions we call still
      # exist, still have the signatures we call them with, and still *behave* the way
      # our token accounting assumes. Without this job it skips everywhere and the
      # guard is decorative -- an upstream rename would surface as a confusing
      # ImportError in production instead of a red check here.
      - name: Install with the engine extra
        run: uv sync --extra dev --extra laya
      - name: Upstream fidelity
        run: uv run pytest tests/test_upstream_contract.py -q

  contract:
    name: contract snapshot unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: The vendored OpenAPI snapshot is still the pinned version
        run: |
          uv run python - <<'PY'
          import hashlib, json, pathlib, sys
          path = pathlib.Path("docs/contract/typesafe-openapi-0.2.0.json")
          raw = path.read_bytes()
          spec = json.loads(raw)
          version = spec["info"]["version"]
          digest = hashlib.sha256(raw).hexdigest()
          print(f"{path} version={version} sha256={digest} bytes={len(raw)}")
          if version != "0.2.0":
              sys.exit("the snapshot's version changed: update docs/api-compatibility.md and the pin")
          PY

  docker:
    name: image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check the compose file still resolves
        # No daemon work and no 3 GB pull: this only validates the schema, the
        # interpolation and the profile selection. What the services are *made of* is
        # checked without docker by `tests/test_compose.py`, against the same `plan`
        # script that decides the published tags.
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile kev-0.8b config -q
          services=$(docker compose config --services | sort | tr '\n' ' ')
          [ "$services" = "laya-multilingual weights-laya-multilingual " ] || {
            echo "the default profile started something else: $services"; exit 1; }
      - name: Build the engine-free image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: decis:ci
      - name: Start the built image and check what it can serve
        # The image installs no engine extra, so it is honestly *not ready*: `/readyz`
        # must say so and `/v1/models` must still answer. A decision request would need
        # weights, which this job deliberately does not download.
        run: |
          docker run --rm -d --name decis-ci -p 8000:8000 \
            -e DECIS_API_KEY=ci decis:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8000/v1/models -H 'Authorization: Bearer ci' | grep -q 'decis/laya-multilingual'
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/readyz)
          [ "$status" = "503" ] || { echo "an engine-free image reported ready ($status)"; exit 1; }
          docker stop decis-ci
