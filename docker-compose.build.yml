# Build the images from this checkout instead of pulling the published ones.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --wait
#
# The images are named locally (`decis-local:*`), so a build never replaces the published
# `kingfs/decis:*` tags on this machine. Add `DECIS_PREDOWNLOAD: <engine>` to an engine's
# build args to bake its weights in, the way a release `-offline` image does.
services:
  weights-laya-multilingual: &build-laya
    image: decis-local:laya-multilingual
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DECIS_EXTRAS: laya
        DECIS_ENGINE: laya-multilingual
  laya-multilingual: *build-laya

  weights-kev-0.8b: &build-kev
    image: decis-local:kev-0.8b
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DECIS_EXTRAS: kev
        DECIS_ENGINE: kev-0.8b
  kev-0.8b: *build-kev
