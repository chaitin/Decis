name: decis

# The deployment file. `docker compose up -d` runs a published image, and the engine
# image already carries its weights (`DECIS_MODEL_DIR=/models`), so there is nothing
# to download, nothing to mount and no second container to wait for.
#
#   cp .env.example .env          # set DECIS_API_KEY; COMPOSE_PROFILES picks the engine
#   docker compose -f docker-compose.yml up -d --wait
#
# `-f docker-compose.yml` is not decoration: inside this checkout a bare
# `docker compose up` also picks up `docker-compose.override.yml`, which builds the same
# services from source and tags them `decis-local:*` (that is the Compose override
# convention, and it is why the build file is named that). Deployments copy this file
# alone and never see the build.
#
# One profile per engine, named after the engine: a bare `up` starts whatever `.env`
# selects (one engine by default -- two engines resident at once hold several GB), and
# `--profile kev-0.8b` starts that one instead of it, not in addition to it.
#
# The `playground` service is not an engine and has no profile of its own: it is listed
# under both engine profiles, so whichever engine `up` starts, the games start with it.
# It finds that engine by asking `/readyz` rather than by reading a name out of `.env`,
# because a service that is not running does not resolve its Compose name at all -- which
# is also why there is no `depends_on` here (and why there cannot be: Compose refuses a
# dependency on a service the active profile does not enable).

x-restart: &restart
  restart: unless-stopped

x-engine: &engine
  <<: *restart
  env_file: [.env]
  # Compose is not an orchestrator: nothing restarts a container because a probe failed, so
  # this probe is free to be the *readiness* one, which makes `--wait` mean "the model can
  # answer". The image's own HEALTHCHECK stays on `/healthz` for orchestrators, where a
  # liveness probe must not fail while the engine is still loading (§2-D22). The `env -u`
  # list is required on both: a probe that inherits HTTP_PROXY asks the proxy for a loopback
  # URL and gets a 502 (§2-D19).
  healthcheck:
    test:
      [
        "CMD",
        "env",
        "-u",
        "HTTP_PROXY",
        "-u",
        "HTTPS_PROXY",
        "-u",
        "http_proxy",
        "-u",
        "https_proxy",
        "-u",
        "ALL_PROXY",
        "-u",
        "all_proxy",
        "python",
        "-c",
        "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).status == 200 else 1)",
      ]
    interval: 5s
    timeout: 5s
    # The engine loads after the container starts (CPU cold start is ~2 min here) and
    # failures during the start period do not count towards `retries`, so this only has to
    # be longer than a cold load -- not long enough to hide an engine that failed outright.
    start_period: 300s
    retries: 3

x-environment: &environment
  # The container listens on 8000 on every interface. `DECIS_PORT` from `.env` must not
  # move it: only the published host port differs per engine.
  DECIS_HOST: 0.0.0.0
  DECIS_PORT: "8000"
  # Pinned because the weights are baked here and `.env` must not be able to point the
  # loader at an empty directory, which would silently turn this into a downloading
  # deployment (§2-D21).
  DECIS_MODEL_DIR: /models
  # `:?` rather than `:-`: starting with no token on a non-loopback address is the exact
  # deployment AGENTS.md §3-19 refuses, so fail here first, with a better message.
  DECIS_API_KEY: ${DECIS_API_KEY:?set DECIS_API_KEY in .env (cp .env.example .env)}

services:
  laya-multilingual:
    <<: *engine
    image: chaitin/decis:laya-multilingual
    profiles: [laya-multilingual]
    environment:
      <<: *environment
      # Pinned per service: `.env` sets DECIS_DEFAULT_ENGINE too, and `env_file` would
      # otherwise aim this container at an engine its image does not contain. The
      # `--engine` argument below beats both.
      DECIS_DEFAULT_ENGINE: laya-multilingual
    # compose's `command` *replaces* the image CMD, it does not append to it, so the
    # entry point is named here (§2-D18).
    command: ["decis", "serve", "--engine", "laya-multilingual"]
    ports: ["${DECIS_HOST_PORT:-8000}:8000"]

  kev-0.8b:
    <<: *engine
    image: chaitin/decis:kev-0.8b
    profiles: [kev-0.8b]
    environment:
      <<: *environment
      DECIS_DEFAULT_ENGINE: kev-0.8b
    command: ["decis", "serve", "--engine", "kev-0.8b"]
    ports: ["${DECIS_KEV_HOST_PORT:-8001}:8000"]

  playground:
    <<: *restart
    image: chaitin/decis:playground
    # In both engine profiles, so it starts with whichever engine does. It cannot be in
    # neither and start by default: a service with no profile starts on *every* `up`,
    # including a deployment that deliberately runs one engine.
    profiles: [laya-multilingual, kev-0.8b]
    # No `env_file: [.env]` on purpose: the values in that file are the engine's
    # (`DECIS_PORT`, `DECIS_MODEL_DIR`, ...), and this container runs none of it. Only the
    # things that are actually its interface are passed.
    environment:
      DECIS_PLAYGROUND_HOST: 0.0.0.0
      DECIS_PLAYGROUND_PORT: "8080"
      # Empty means "find the engine yourself": `server.py` tries this first when it is
      # set, then the candidate list below. The candidates name both engine services and
      # the host, so the same image works under either profile and next to a
      # `decis serve` running outside Compose.
      DECIS_PLAYGROUND_UPSTREAM: ${DECIS_PLAYGROUND_UPSTREAM:-}
      DECIS_PLAYGROUND_CANDIDATES: ${DECIS_PLAYGROUND_CANDIDATES:-http://laya-multilingual:8000,http://kev-0.8b:8000,http://host.docker.internal:8000}
      DECIS_API_KEY: ${DECIS_API_KEY:?set DECIS_API_KEY in .env (cp .env.example .env)}
    # Makes `host.docker.internal` resolve on Linux too, for the "engine running on the
    # host" case above.
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${DECIS_PLAYGROUND_HOST_PORT:-8080}:8080"]
    # The playground's probe is its own liveness, not the engine's readiness: the process
    # is healthy whether or not it has found an engine, because "no engine yet" is the
    # normal state for the minutes a CPU engine spends loading. `/readyz` on the playground
    # is where "connected" is answered. Proxies are unset for the same reason as the
    # engine probe (§2-D19).
    healthcheck:
      test:
        [
          "CMD",
          "env",
          "-u",
          "HTTP_PROXY",
          "-u",
          "HTTPS_PROXY",
          "-u",
          "http_proxy",
          "-u",
          "https_proxy",
          "-u",
          "ALL_PROXY",
          "-u",
          "all_proxy",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

# Mount nothing at /models. A named volume there is seeded from the image and then keeps
# its own copy; a bind mount replaces the baked weights outright. Either way an image that
# answers offline starts reaching for the Hub (§2-D21). To keep the weights on a volume
# instead, use a weightless image -- a release artifact, so the tag carries a version --
# and fill the volume once:
#
#   docker run --rm -v decis_models:/models chaitin/decis:laya-multilingual-runtime-v1.2.0 \
#     decis download --engine laya-multilingual
#   docker run --rm -p 8000:8000 -v decis_models:/models -e DECIS_API_KEY=change-me \
#     chaitin/decis:laya-multilingual-runtime-v1.2.0
