name: decis

# The deployment file. `docker compose up -d` runs a published image, and the image
# already carries the engine's weights (`DECIS_MODEL_DIR=/models`), so there is nothing
# to download, nothing to mount and no second container to wait for.
#
#   cp .env.example .env          # set DECIS_API_KEY; COMPOSE_PROFILES picks the engine
#   docker compose -f docker-compose.yml up -d --wait
#
# `-f docker-compose.yml` is not decoration: inside this checkout a bare
# `docker compose up` also picks up `docker-compose.override.yml`, which builds the same
# services from source and tags them `decis-local:*` (that is the Compose override
# convention, and it is why the build file is named that). Deployments copy this file
# alone and never see the build.
#
# One profile per engine, named after the engine: a bare `up` starts whatever `.env`
# selects (one engine by default -- two engines resident at once hold several GB), and
# `--profile kev-0.8b` starts that one instead of it, not in addition to it.

x-service: &service
  restart: unless-stopped
  env_file: [.env]
  # Compose is not an orchestrator: nothing restarts a container because a probe failed, so
  # this probe is free to be the *readiness* one, which makes `--wait` mean "the model can
  # answer". The image's own HEALTHCHECK stays on `/healthz` for orchestrators, where a
  # liveness probe must not fail while the engine is still loading (§2-D22). The `env -u`
  # list is required on both: a probe that inherits HTTP_PROXY asks the proxy for a loopback
  # URL and gets a 502 (§2-D19).
  healthcheck:
    test:
      [
        "CMD",
        "env",
        "-u",
        "HTTP_PROXY",
        "-u",
        "HTTPS_PROXY",
        "-u",
        "http_proxy",
        "-u",
        "https_proxy",
        "-u",
        "ALL_PROXY",
        "-u",
        "all_proxy",
        "python",
        "-c",
        "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).status == 200 else 1)",
      ]
    interval: 5s
    timeout: 5s
    # The engine loads after the container starts (CPU cold start is ~80-100 s) and
    # failures during the start period do not count towards `retries`, so this only has to
    # be longer than a cold load -- not long enough to hide an engine that failed outright.
    start_period: 300s
    retries: 3

x-environment: &environment
  # The container listens on 8000 on every interface. `DECIS_PORT` from `.env` must not
  # move it: only the published host port differs per engine.
  DECIS_HOST: 0.0.0.0
  DECIS_PORT: "8000"
  # Pinned because the weights are baked here and `.env` must not be able to point the
  # loader at an empty directory, which would silently turn this into a downloading
  # deployment (§2-D21).
  DECIS_MODEL_DIR: /models
  # `:?` rather than `:-`: starting with no token on a non-loopback address is the exact
  # deployment AGENTS.md §3-19 refuses, so fail here first, with a better message.
  DECIS_API_KEY: ${DECIS_API_KEY:?set DECIS_API_KEY in .env (cp .env.example .env)}

services:
  laya-multilingual:
    <<: *service
    image: kingfs/decis:laya-multilingual
    profiles: [laya-multilingual]
    environment:
      <<: *environment
      # Pinned per service: `.env` sets DECIS_DEFAULT_ENGINE too, and `env_file` would
      # otherwise aim this container at an engine its image does not contain. The
      # `--engine` argument below beats both.
      DECIS_DEFAULT_ENGINE: laya-multilingual
    # compose's `command` *replaces* the image CMD, it does not append to it, so the
    # entry point is named here (§2-D18).
    command: ["decis", "serve", "--engine", "laya-multilingual"]
    ports: ["${DECIS_HOST_PORT:-8000}:8000"]

  kev-0.8b:
    <<: *service
    image: kingfs/decis:kev-0.8b
    profiles: [kev-0.8b]
    environment:
      <<: *environment
      DECIS_DEFAULT_ENGINE: kev-0.8b
    command: ["decis", "serve", "--engine", "kev-0.8b"]
    ports: ["${DECIS_KEV_HOST_PORT:-8001}:8000"]

# Mount nothing at /models. A named volume there is seeded from the image and then keeps
# its own copy; a bind mount replaces the baked weights outright. Either way an image that
# answers offline starts reaching for the Hub (§2-D21). To keep the weights on a volume
# instead, use a weightless image -- a release artifact, so the tag carries a version --
# and fill the volume once:
#
#   docker run --rm -v decis_models:/models kingfs/decis:laya-multilingual-runtime-v1.2.0 \
#     decis download --engine laya-multilingual
#   docker run --rm -p 8000:8000 -v decis_models:/models -e DECIS_API_KEY=change-me \
#     kingfs/decis:laya-multilingual-runtime-v1.2.0
