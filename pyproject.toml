[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decis"
version = "0.4.0"
description = "One API to run all light-weight decision models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Decis contributors" }]
keywords = ["decision-models", "inference-server", "system-one", "laya", "kev"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
# Engine dependencies live here, never in [project.dependencies]: an image that
# installs decis[laya] has no peft, and vice versa. See AGENTS.md §6.
#
# Every engine that publishes weights also asks for `decis[download]`: the Hub clients are
# how those weights arrive, and "which client" is a property of the network rather than of
# the engine (`decis/hub.py` chooses between them at build/deploy time). Declared once here
# instead of restating `modelscope` in three extras, so a fourth engine cannot forget it.
#
# `laya` declares its own torch/transformers/safetensors/huggingface_hub, so this
# deliberately does not restate them. Adding a floor Decis has not tested would be a
# compatibility claim we cannot back; the combination that *is* tested is recorded in
# docs/design.md §7.2.
laya = ["laya>=0.3.5,<0.4", "decis[download]"]
# The floors are what the vendored copy actually needs, not a guess: it calls
# `AutoModelForCausalLM.from_pretrained(..., dtype=...)` and
# `DynamicCache(config=...)` (transformers 5) and `PeftModel.from_pretrained(...,
# torch_device=...)` (peft 0.13+). The combination that is *tested* is recorded in
# docs/design.md §7.2 -- a floor is a compatibility claim, and 4.44 was one we could
# not back.
kev = [
  "torch>=2.6",
  "transformers>=5.0",
  "peft>=0.18",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "huggingface_hub>=0.30",
  "decis[download]",
]
# What the vendored copy actually calls: `AutoProcessor` / `AutoTokenizer` and
# `...Model.from_pretrained(..., dtype=..., attn_implementation="sdpa")` (the `dtype=`
# spelling is transformers 5), `safetensors.torch.load_file` for `readout.safetensors`,
# `pillow`, which `_jeff_vendor/model.py` imports at module scope, and `torchvision`,
# which the *text* path needs despite appearances: the Qwen checkpoint's processor is
# `Qwen3VLProcessor` (Qwen3-VL), and `AutoProcessor.from_pretrained` eagerly builds every
# sub-processor named in `processor_config.json` -- including the video one, whose class
# raises `ImportError: Qwen3VLVideoProcessor requires the Torchvision library` at *import*
# time. So the load fails before any tensor is read. Measured, not assumed: this extra
# shipped without torchvision for one round and `tests/test_jeff_inference.py` was the
# only thing that noticed (2026-09-30, torchvision 0.29.0 + torch 2.14.0).
#
# The `python_version` marker is the other half of the same honesty: the vendored serving
# code uses PEP 695 `type` aliases (`_jeff_vendor/types.py`), which do not *parse* before
# 3.12, so on 3.11 this extra would install a multi-gigabyte stack that cannot be imported.
# The marker keeps it from being installed there at all, and `decis models` then says
# "needs Python 3.12+" instead of "no torch module" -- `registry.EngineSpec.python_min` owns
# the number, `docs/engines.md` explains it (`design-review.md §2-D31`). The project's own
# floor stays 3.11: the other four engines work there, and the images run 3.13.
jeff = [
  "torch>=2.6; python_version >= '3.12'",
  "transformers>=5.0; python_version >= '3.12'",
  "torchvision>=0.20; python_version >= '3.12'",
  "safetensors>=0.4; python_version >= '3.12'",
  "pillow>=10; python_version >= '3.12'",
  "huggingface_hub>=0.30; python_version >= '3.12'",
  # Unmarked on purpose: fetching a Jeff checkpoint is a `decis download` on a build host,
  # which is allowed to run the project's floor (3.11) even though *serving* Jeff is not.
  "decis[download]",
]
# Reserved: the `remote` engine and the `/metrics` endpoint are not implemented yet
# (see docs/design.md §11). These extras are declared so the dependency choice is
# recorded, but `uv sync --extra remote` currently buys you nothing.
remote = ["httpx>=0.27"]
metrics = ["prometheus-client>=0.20"]
dev = [
  "httpx>=0.27",
  # `tests/test_docker_workflow.py` reads `.github/workflows/docker-build.yml` and executes
  # its matrix-generation script. Dev-only on purpose, but it must be here: the test exists
  # so a release-time mistake is caught on every push, which means it has to run in CI
  # rather than skip.
  "pyyaml>=6.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "typesafe-sdk>=0.7.1",
]
all = ["decis[laya,kev,jeff,remote,metrics,download]"]

# The Hub clients `decis download` (and a cold-cache `serve`) can fetch through:
# `huggingface_hub`, which can address a pinned commit, and `modelscope`, whose mirrors
# answer on networks that cannot reach Hugging Face. Both live here rather than in each
# engine extra because "which Hub" is a property of the deployment, not of the engine --
# `decis/hub.py` picks at run time and `DECIS_HUB` pins the choice. `decis doctor` reports
# which of the two is missing when one is.
download = ["huggingface_hub>=0.20", "modelscope>=1.16"]

[project.urls]
Homepage = "https://github.com/chaitin/Decis"
Issues = "https://github.com/chaitin/Decis/issues"
Changelog = "https://github.com/chaitin/Decis/releases"

[project.scripts]
decis = "decis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "weights: requires real model weights (deselected by default in CI)",
  "network: makes real network calls",
]
filterwarnings = ["error::DeprecationWarning:decis.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# Vendored third-party code is kept byte-identical to upstream so that its sha256 is
# a meaningful pin (tests/test_kev_vendor.py). Reformatting it to our style would
# break that, so it is excluded rather than edited. See VENDOR.md.
extend-exclude = ["src/decis/engines/_kev_vendor", "src/decis/engines/_jeff_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # FastAPI's Depends()/Body() in defaults is the documented idiom
  "RUF012", # ClassVar annotation is noise for our small model classes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# benchmarks/report.py renders the Chinese section of docs/feasibility.md, so its
# string literals contain full-width punctuation on purpose. Emitting it is the job.
"benchmarks/report.py" = ["RUF001"]

[tool.ruff.lint.isort]
# `fixture_engine` is our own code too: the weight-free test double lives in `tests/`
# (it is deliberately absent from the shipped registry), and it is imported as a
# top-level module because `tests/` is not a package.
# `playground` is the web service: it is not part of the `decis` wheel either (its image
# installs nothing and imports nothing), but it is ours, so its imports sort as first-party.
known-first-party = ["decis", "fixture_engine", "playground"]
