[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decis"
version = "0.1.0"
description = "One API to run all light-weight decision models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Decis contributors" }]
keywords = ["decision-models", "inference-server", "system-one", "laya", "kev"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
# Engine dependencies live here, never in [project.dependencies]: an image that
# installs decis[laya] has no peft, and vice versa. See AGENTS.md §6.
#
# `laya` declares its own torch/transformers/safetensors/huggingface_hub, so this
# deliberately does not restate them. Adding a floor Decis has not tested would be a
# compatibility claim we cannot back; the combination that *is* tested is recorded in
# docs/design.md §7.2.
laya = ["laya>=0.3.5,<0.4"]
# The floors are what the vendored copy actually needs, not a guess: it calls
# `AutoModelForCausalLM.from_pretrained(..., dtype=...)` and
# `DynamicCache(config=...)` (transformers 5) and `PeftModel.from_pretrained(...,
# torch_device=...)` (peft 0.13+). The combination that is *tested* is recorded in
# docs/design.md §7.2 -- a floor is a compatibility claim, and 4.44 was one we could
# not back.
kev = ["torch>=2.6", "transformers>=5.0", "peft>=0.18", "accelerate>=1.0", "safetensors>=0.4", "huggingface_hub>=0.30"]
# Reserved: the `remote` engine and the `/metrics` endpoint are not implemented yet
# (see docs/design.md §11). These extras are declared so the dependency choice is
# recorded, but `uv sync --extra remote` currently buys you nothing.
remote = ["httpx>=0.27"]
metrics = ["prometheus-client>=0.20"]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "typesafe-sdk>=0.7.1",
]
all = ["decis[laya,kev,remote,metrics]"]

# `decis download` needs huggingface_hub, which arrives with any engine that has
# weights. `decis doctor` says so explicitly when it is missing.
download = ["huggingface_hub>=0.20"]

[project.urls]
Homepage = "https://github.com/kingfs/Decis"
Issues = "https://github.com/kingfs/Decis/issues"
Changelog = "https://github.com/kingfs/Decis/releases"

[project.scripts]
decis = "decis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "weights: requires real model weights (deselected by default in CI)",
  "network: makes real network calls",
]
filterwarnings = ["error::DeprecationWarning:decis.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# Vendored third-party code is kept byte-identical to upstream so that its sha256 is
# a meaningful pin (tests/test_kev_vendor.py). Reformatting it to our style would
# break that, so it is excluded rather than edited. See VENDOR.md.
extend-exclude = ["src/decis/engines/_kev_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH"]
ignore = [
  "E501",   # line length is handled by the formatter
  "B008",   # FastAPI's Depends()/Body() in defaults is the documented idiom
  "RUF012", # ClassVar annotation is noise for our small model classes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# benchmarks/report.py renders the Chinese section of docs/feasibility.md, so its
# string literals contain full-width punctuation on purpose. Emitting it is the job.
"benchmarks/report.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["decis"]
